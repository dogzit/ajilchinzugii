  </head><body class="bg-background text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between gap-space-xs"><div class="flex items-center gap-space-xs"><button aria-label="Буцах" class="w-11 h-11 flex items-center justify-center rounded-full text-ink hover:bg-surface-container transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[20px]">arrow_back_ios_new</span></button><h1 class="font-headline-sm text-headline-sm text-ink truncate">Violation Report Stepper</h1></div><div class="flex items-center gap-space-xs"><button aria-label="Theme toggle" class="w-11 h-11 flex items-center justify-center rounded-full text-ink hover:bg-surface-container transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">light_mode</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe px-margin bg-background min-h-screen"><div class="flex flex-col w-full pb-safe">
<!-- Brand Bar Navigation -->
<div class="w-full flex items-center justify-between py-3 mb-4">
<div class="flex items-center gap-2">
<!-- Hexagon Bee Mark Motif -->
<svg class="w-7 h-7 text-accent-mark shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<polygon fill="none" points="12 2 20.66 7 20.66 17 12 22 3.34 17 3.34 7" stroke="currentColor"></polygon>
<path d="M8.5 10C8.5 8.5 10 7.5 12 7.5C14 7.5 15.5 8.5 15.5 10C15.5 12.5 12 16.5 12 16.5C12 16.5 8.5 12.5 8.5 10Z" fill="currentColor" fill-opacity="0.15" stroke="currentColor"></path>
<line stroke="currentColor" x1="9" x2="15" y1="11" y2="11"></line>
<line stroke="currentColor" x1="10" x2="14" y1="13" y2="13"></line>
</svg>
<span class="font-headline-sm text-headline-sm text-ink tracking-tight font-semibold">Ажилчин Зөгий</span>
</div>
<div class="flex items-center gap-1.5">
<button class="h-8 px-2.5 rounded-full bg-surface-container text-ink-muted font-label-sm text-label-sm hover:bg-surface-variant transition-colors flex items-center justify-center" type="button">
        EN
      </button>
<button aria-label="Theme toggle" class="w-8 h-8 rounded-full flex items-center justify-center text-ink hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">light_mode</span>
</button>
<button class="h-8 px-2 rounded-full font-label-md text-label-md text-ink hover:bg-surface-container transition-colors" type="button">
        Нэвтрэх
      </button>
<button aria-label="Menu" class="w-8 h-8 rounded-full flex items-center justify-center text-ink hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">menu</span>
</button>
</div>
</div>
<!-- Header & Context Band -->
<div class="flex flex-col gap-2.5 mb-5">
<div class="flex items-center justify-between gap-2 flex-wrap">
<h2 class="font-headline-md text-headline-md text-ink leading-tight">
        Ажилчин Зөгийтэй ярилцах
      </h2>
<div class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-surface-tint text-accent-text font-label-sm text-label-sm font-medium">
<span class="material-symbols-outlined text-[14px]">schedule</span>
<span>Хариу: 3 хоногийн дотор</span>
</div>
</div>
<!-- Lead text with emergency anchor -->
<p class="font-body-md text-body-md text-ink-muted leading-relaxed">
      Манай ажилтан тантай холбогдоно. Яаралтай бол <a class="text-accent-text font-semibold underline decoration-accent-mark underline-offset-2" href="tel:108">108</a> руу залга.
    </p>
</div>
<!-- Intake Form Card -->
<form class="w-full bg-surface rounded-lg p-5 flex flex-col gap-5 relative overflow-hidden shadow-none" onsubmit="event.preventDefault();" style="box-shadow: 0 0 0 1px #eadfcc;">
<!-- Subtle faint hexagon watermark backdrop -->
<div class="absolute -right-12 -top-12 pointer-events-none opacity-[0.035] text-ink">
<svg fill="none" height="220" stroke="currentColor" stroke-width="2" viewbox="0 0 100 100" width="220">
<polygon points="50 5 90 27.5 90 72.5 50 95 10 72.5 10 27.5"></polygon>
<polygon points="50 18 80 35 80 65 50 82 20 65 20 35"></polygon>
</svg>
</div>
<!-- Radio group: Холбогдох арга -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-ink font-medium">
        Холбогдох арга
      </label>
<div aria-label="Холбогдох арга" class="grid grid-cols-2 gap-2" role="radiogroup">
<label class="flex items-center justify-center gap-2 h-11 px-3 rounded-full bg-surface-container cursor-pointer select-none text-ink font-body-md text-body-md transition-colors has-[:checked]:bg-primary-container has-[:checked]:text-ink has-[:checked]:font-semibold">
<input checked="" class="sr-only" name="contact_method" type="radio" value="phone"/>
<span class="material-symbols-outlined text-[18px]">call</span>
<span>Утас</span>
</label>
<label class="flex items-center justify-center gap-2 h-11 px-3 rounded-full bg-surface-container cursor-pointer select-none text-ink font-body-md text-body-md transition-colors has-[:checked]:bg-primary-container has-[:checked]:text-ink has-[:checked]:font-semibold">
<input class="sr-only" name="contact_method" type="radio" value="facebook"/>
<span class="material-symbols-outlined text-[18px]">chat</span>
<span>Facebook</span>
</label>
</div>
</div>
<!-- Text input: Утасны дугаар эсвэл Facebook хаяг -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-ink font-medium" for="contact-input">
        Утасны дугаар эсвэл Facebook хаяг
      </label>
<input autocomplete="off" class="w-full h-12 px-4 rounded-xl bg-surface text-ink font-body-md text-body-md placeholder:text-outline outline-none focus:bg-surface-bright transition-colors" id="contact-input" style="box-shadow: 0 0 0 1px #eadfcc;" type="text"/>
</div>
<!-- Select: Залгахад тохиромжтой цаг -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-ink font-medium" for="time-select">
        Залгахад тохиромжтой цаг
      </label>
<div class="relative w-full">
<select class="w-full h-12 px-4 pr-10 rounded-xl bg-surface text-ink font-body-md text-body-md appearance-none outline-none focus:bg-surface-bright transition-colors cursor-pointer" id="time-select" style="box-shadow: 0 0 0 1px #eadfcc;">
<option value="morning">Өглөө</option>
<option value="afternoon">Өдөр</option>
<option value="evening">Орой</option>
</select>
<div class="absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none text-ink-muted flex items-center">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
</div>
<!-- Textarea: Товч тайлбар (заавал биш) -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-ink font-medium" for="desc-textarea">
        Товч тайлбар (заавал биш)
      </label>
<textarea class="w-full p-3.5 rounded-xl bg-surface text-ink font-body-md text-body-md resize-none outline-none focus:bg-surface-bright transition-colors" id="desc-textarea" rows="3" style="box-shadow: 0 0 0 1px #eadfcc;"></textarea>
</div>
<!-- Checkboxes -->
<div class="flex flex-col gap-4 pt-1">
<!-- Checkbox a -->
<label class="flex items-start gap-3 cursor-pointer select-none group">
<div class="relative flex items-center justify-center shrink-0 w-6 h-6 mt-0.5 rounded-md bg-surface transition-colors" style="box-shadow: 0 0 0 1px #eadfcc;">
<input class="sr-only peer" type="checkbox"/>
<div class="w-full h-full rounded-md peer-checked:bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary text-[18px] opacity-0 peer-checked:opacity-100 font-bold transition-opacity">check</span>
</div>
</div>
<span class="font-body-md text-body-md text-ink leading-snug">
          Надтай холбогдохыг зөвшөөрч байна
        </span>
</label>
<!-- Checkbox b with helper text -->
<div class="flex flex-col gap-1">
<label class="flex items-start gap-3 cursor-pointer select-none group">
<div class="relative flex items-center justify-center shrink-0 w-6 h-6 mt-0.5 rounded-md bg-surface transition-colors" style="box-shadow: 0 0 0 1px #eadfcc;">
<input class="sr-only peer" type="checkbox"/>
<div class="w-full h-full rounded-md peer-checked:bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary text-[18px] opacity-0 peer-checked:opacity-100 font-bold transition-opacity">check</span>
</div>
</div>
<span class="font-body-md text-body-md text-ink leading-snug">
            Ажилчин Зөгий надад туслахын тулд хадгал
          </span>
</label>
<p class="pl-9 font-body-sm text-body-sm text-ink-muted leading-tight">
          Регистрийн дугаар устгагдаж, файл шифрлэгдэнэ. 90 хоногийн дараа автоматаар устна.
        </p>
</div>
<!-- Checkbox c -->
<label class="flex items-start gap-3 cursor-pointer select-none group">
<div class="relative flex items-center justify-center shrink-0 w-6 h-6 mt-0.5 rounded-md bg-surface transition-colors" style="box-shadow: 0 0 0 1px #eadfcc;">
<input class="sr-only peer" type="checkbox"/>
<div class="w-full h-full rounded-md peer-checked:bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary text-[18px] opacity-0 peer-checked:opacity-100 font-bold transition-opacity">check</span>
</div>
</div>
<span class="font-body-md text-body-md text-ink leading-snug">
          Эцэг эх / асран хамгаалагч зөвшөөрсөн (18 хүрээгүй бол)
        </span>
</label>
</div>
<!-- Primary CTA Button (height 52px, fully rounded pill, honey #e8a33d fill, text #2b2118, 600 weight) -->
<div class="pt-2 flex flex-col gap-3">
<button class="w-full h-[52px] rounded-full bg-primary-container text-ink font-body-md text-body-md font-semibold flex items-center justify-center active:scale-[0.99] transition-transform select-none" type="submit">
        Илгээх
      </button>
<!-- Privacy link -->
<div class="w-full text-center">
<a class="font-body-sm text-body-sm text-ink-muted underline underline-offset-4 hover:text-accent-text transition-colors" href="#privacy">
          Нууцлалын бодлого
        </a>
</div>
</div>
</form>
</div></main></body></html>
