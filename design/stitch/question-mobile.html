<!-- 1. Top bar inside content: Back button + Stepper + Progress bar -->
<div class="flex flex-col gap-space-sm">
<div class="flex items-center justify-between">
<button class="inline-flex items-center gap-space-xs min-h-[44px] text-ink font-label-md text-label-md hover:text-primary transition-colors" type="button">
<span>← Буцах</span>
</button>
<span class="font-label-md text-label-md text-ink-muted tabular-nums">6 / 15</span>
</div>
<div class="w-full h-1.5 bg-border rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full" style="width: 40%;"></div>
</div>
</div>
<!-- 2 & 3. Question heading & Helper text -->
<div class="flex flex-col gap-space-sm">
<h1 class="font-headline-md text-headline-md text-ink">
      Ихэвчлэн хэдэн цагт ажил эхэлж, хэдэн цагт дуусдаг вэ?
    </h1>
<p class="font-body-md text-body-md text-ink-muted">
      Өдрийн ердийн ажлынхаа цагийг бич.
    </p>
</div>
<!-- 4. Two large time inputs side by side -->
<div class="grid grid-cols-2 gap-space-md">
<label class="flex flex-col gap-space-xs p-space-md bg-surface border border-border rounded-[24px] cursor-pointer focus-within:border-border-strong transition-colors">
<span class="font-label-md text-label-md text-ink-muted">Эхлэх</span>
<input aria-label="Эхлэх" class="w-full bg-transparent font-headline-lg text-headline-lg text-ink tabular-nums focus:outline-none" inputmode="numeric" type="text" value="09:00"/>
</label>
<label class="flex flex-col gap-space-xs p-space-md bg-surface border border-border rounded-[24px] cursor-pointer focus-within:border-border-strong transition-colors">
<span class="font-label-md text-label-md text-ink-muted">Дуусах</span>
<input aria-label="Дуусах" class="w-full bg-transparent font-headline-lg text-headline-lg text-ink tabular-nums focus:outline-none" inputmode="numeric" type="text" value="18:00"/>
</label>
</div>
<!-- 5. Full-width break input field -->
<label class="flex flex-col gap-space-xs p-space-md bg-surface border border-border rounded-[24px] cursor-pointer focus-within:border-border-strong transition-colors">
<span class="font-label-md text-label-md text-ink-muted">Завсарлага (минут)</span>
<input aria-label="Завсарлага (минут)" class="w-full bg-transparent font-headline-md text-headline-md text-ink tabular-nums focus:outline-none" inputmode="numeric" type="number" value="60"/>
</label>
<!-- 6 & 7. Actions -->
<div class="flex flex-col gap-space-md pt-space-sm">
<button class="w-full h-[44px] rounded-full border border-border-strong bg-transparent text-ink font-label-md text-label-md flex items-center justify-center transition-colors" id="unknown-btn" type="button">
      Мэдэхгүй байна
    </button>
<button class="w-full h-[52px] rounded-full bg-primary-container text-ink font-label-md text-label-md flex items-center justify-center transition-opacity active:opacity-90" type="button">
      Үргэлжлүүлэх
    </button>
</div>
</div>
<script>
  (function () {
    const unknownBtn = document.getElementById('unknown-btn');
    if (unknownBtn) {
      unknownBtn.addEventListener('click', function () {
        const isActive = unknownBtn.getAttribute('data-selected') === 'true';
        if (isActive) {
          unknownBtn.setAttribute('data-selected', 'false');
          unknownBtn.classList.remove('bg-secondary-container');
          unknownBtn.classList.add('bg-transparent');
        } else {
          unknownBtn.setAttribute('data-selected', 'true');
          unknownBtn.classList.remove('bg-transparent');
          unknownBtn.classList.add('bg-secondary-container');
        }
      });
    }
  })();
</script></main><nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface/90 backdrop-blur-xl" data-active-classes="text-primary"><div class="flex justify-around items-center h-20 px-gutter"><a class="flex flex-col items-center justify-center gap-space-xs min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-all" data-path="home" href="#"><span class="material-symbols-outlined">home</span><span class="font-label-sm text-label-sm">Нүүр</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-space-xs min-w-[44px] min-h-[44px] transition-all text-primary" data-path="rights-check" href="#"><span class="material-symbols-outlined">fact_check</span><span class="font-label-sm text-label-sm">Шалгах</span></a><a class="flex flex-col items-center justify-center gap-space-xs min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-all" data-path="guides" href="#"><span class="material-symbols-outlined">menu_book</span><span class="font-label-sm text-label-sm">Хууль</span></a><a class="flex flex-col items-center justify-center gap-space-xs min-w-[44px] min-h-[44px] text-on-surface-variant hover:text-on-surface transition-all" data-path="report-case" href="#"><span class="material-symbols-outlined">shield</span><span class="font-label-sm text-label-sm">Мэдэгдэх</span></a></div></nav></body></html>
