<html lang="mn"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_standard" name="shell-type"/><title>Ажилчин Зөгий</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,600;1,7..72,600&amp;family=Source+Sans+3:wght@400;500;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

-full bg-primary-container/20 flex items-center justify-center text-accent-text"><span class="material-symbols-outlined text-[20px]">hexagon</span></div><span class="font-headline-sm text-headline-sm text-ink tracking-tight">Ажилчин Зөгий</span></a><nav class="hidden items-center gap-space-md" data-active-classes="text-ink font-semibold"><a aria-current="page" class="transition-colors text-ink font-semibold" data-path="home" href="#">Нүүр</a><a class="font-label-md text-label-md text-ink-muted hover:text-ink transition-colors" data-path="rights-guide" href="#">Эрхийн лавлах</a><a class="font-label-md text-label-md text-ink-muted hover:text-ink transition-colors" data-path="legal-checker" href="#">Зөрчил шалгах</a></nav><div class="flex items-center gap-space-sm"><button class="px-3 py-1 rounded-full bg-surface-container font-label-sm text-label-sm text-ink hover:bg-secondary-container hover:text-on-secondary-container transition-colors tracking-wide" type="button">EN</button><button aria-label="Theme toggle" class="w-8 h-8 rounded-full flex items-center justify-center text-ink-muted hover:text-ink hover:bg-surface-container transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">light_mode</span></button><a class="px-space-md py-1.5 rounded-full font-label-md text-label-md text-ink hover:bg-surface-container transition-colors" data-path="login" href="#">Нэвтрэх</a><button aria-label="Цэс нээх" class="w-9 h-9 rounded-full flex items-center justify-center text-ink hover:bg-surface-container transition-colors" type="button"><span class="material-symbols-outlined text-[22px]">menu</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="w-full flex-1 pt-16 bg-background max-w-[1280px] mx-auto px-margin lg:px-gutter-desktop"><div class="flex flex-col w-full items-center justify-center relative py-space-2xl lg:py-space-3xl overflow-hidden">
<div aria-hidden="true" class="absolute inset-0 pointer-events-none opacity-60 flex items-center justify-center">
<svg class="w-full h-full text-border" height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="97" id="hex-pattern" patterntransform="scale(1)" patternunits="userSpaceOnUse" width="56">
<path d="M28 0 L56 16.166 L56 48.5 L28 64.666 L0 48.5 L0 16.166 Z M28 97 L56 80.834 L56 48.5 L28 64.666 L0 48.5 L0 80.834 Z" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1"></path>
</pattern>
</defs>
<rect fill="url(#hex-pattern)" height="100%" width="100%"></rect>
</svg>
</div>
<div class="relative z-10 w-full max-w-[500px] bg-surface rounded-[24px] border border-border p-8 sm:p-11 mx-auto flex flex-col">
<div class="flex items-center gap-space-xs text-accent-text mb-2">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-ink-muted">Хувийн нууцлал хамгаалагдсан</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-ink font-semibold tracking-tight">
      Бүртгүүлэх
    </h1>
<p class="font-body-md text-body-md text-ink-muted mt-1.5 mb-6">
      Зөвхөн и-мэйл хэрэгтэй. Нэр шаардахгүй.
    </p>
<form class="flex flex-col w-full" onsubmit="event.preventDefault();">
<div class="flex flex-col">
<label class="font-label-md text-label-md text-ink mb-2" for="email">
          И-мэйл хаяг
        </label>
<input class="w-full h-12 rounded-full border border-border bg-surface-container-lowest px-5 font-body-md text-body-md text-ink placeholder:text-outline-variant focus:outline-none focus:border-ink transition-colors" id="email" name="email" placeholder="жишээ@мэйл.mn" required="" type="email"/>
</div>
<div class="flex flex-col mt-5">
<label class="font-label-md text-label-md text-ink mb-2">
          Насны бүлэг
        </label>
<div aria-label="Насны бүлэг" class="grid grid-cols-3 gap-2.5" role="radiogroup">
<button aria-checked="false" class="age-btn h-11 rounded-full border border-border bg-surface text-ink font-label-md text-label-md flex items-center justify-center transition-colors hover:bg-surface-container" onclick="selectAge(this)" role="radio" type="button">
            13–14
          </button>
<button aria-checked="true" class="age-btn h-11 rounded-full bg-primary-container text-ink font-label-md text-label-md font-medium flex items-center justify-center transition-colors" onclick="selectAge(this)" role="radio" type="button">
            15–17
          </button>
<button aria-checked="false" class="age-btn h-11 rounded-full border border-border bg-surface text-ink font-label-md text-label-md flex items-center justify-center transition-colors hover:bg-surface-container" onclick="selectAge(this)" role="radio" type="button">
            18–24
          </button>
</div>
</div>
<div class="mt-4 bg-surface-tint rounded-[20px] p-5 border border-border flex flex-col gap-3.5 transition-all" id="consent-box">
<label class="flex items-center gap-3 cursor-pointer select-none group">
<input checked="" class="sr-only peer" id="consent-age" type="checkbox"/>
<div class="w-5 h-5 rounded-full border border-border-strong bg-surface flex items-center justify-center peer-checked:bg-ink peer-checked:border-ink transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[16px] text-surface font-bold">check</span>
</div>
<span class="font-body-sm text-body-sm text-ink">Би 13–17 настай</span>
</label>
<label class="flex items-center gap-3 cursor-pointer select-none group">
<input checked="" class="sr-only peer" id="consent-guardian" type="checkbox"/>
<div class="w-5 h-5 rounded-full border border-border-strong bg-surface flex items-center justify-center peer-checked:bg-ink peer-checked:border-ink transition-colors flex-shrink-0">
<span class="material-symbols-outlined text-[16px] text-surface font-bold">check</span>
</div>
<span class="font-body-sm text-body-sm text-ink">Эцэг эх / асран хамгаалагч маань зөвшөөрсөн</span>
</label>
</div>
<p class="font-label-sm text-label-sm text-ink-muted mt-3.5 leading-relaxed">
        13 хүрээгүй бол бүртгэл үүсгэхгүй, гэхдээ хэрэгслүүдийг ашиглаж болно.
      </p>
<button class="w-full h-[52px] rounded-full bg-primary-container text-ink font-label-md text-label-md font-semibold mt-6 hover:brightness-95 active:brightness-90 transition-all flex items-center justify-center" type="submit">
        Бүртгүүлэх
      </button>
<div class="w-full flex justify-center mt-5">
<a class="font-body-sm text-body-sm text-ink hover:text-accent-text underline underline-offset-4 decoration-border-strong hover:decoration-accent-text transition-colors" data-path="login" href="#">
          Бүртгэлтэй юу? Нэвтрэх
        </a>
</div>
</form>
</div>
</div>
<script>
  function selectAge(selectedBtn) {
    const buttons = document.querySelectorAll('.age-btn');
    buttons.forEach(btn => {
      btn.setAttribute('aria-checked', 'false');
      btn.className = 'age-btn h-11 rounded-full border border-border bg-surface text-ink font-label-md text-label-md flex items-center justify-center transition-colors hover:bg-surface-container';
    });
    
    selectedBtn.setAttribute('aria-checked', 'true');
    selectedBtn.className = 'age-btn h-11 rounded-full bg-primary-container text-ink font-label-md text-label-md font-medium flex items-center justify-center transition-colors';

    const consentBox = document.getElementById('consent-box');
    const ageVal = selectedBtn.innerText.trim();
    if (ageVal === '18–24') {
      consentBox.classList.add('opacity-40', 'pointer-events-none');
    } else {
      consentBox.classList.remove('opacity-40', 'pointer-events-none');
    }
  }
</script></main><footer class="w-full bg-background"><div class="max-w-[1280px] mx-auto px-margin lg:px-gutter-desktop py-space-xl flex items-center justify-center"><p class="font-body-sm text-body-sm text-ink-muted tracking-normal">© Ажилчин Зөгий</p></div></footer></body></html>
