<script>
  function selectSegment(btn, group) {
    const selector = group === 'age' ? '.age-btn' : '.exp-btn';
    const buttons = document.querySelectorAll(selector);
    buttons.forEach(b => {
      b.classList.remove('bg-primary-container', 'text-ink', 'font-semibold', 'border-primary-container');
      b.classList.add('border-border', 'text-ink-muted');
    });
    btn.classList.add('bg-primary-container', 'text-ink', 'font-semibold', 'border-primary-container');
    btn.classList.remove('border-border', 'text-ink-muted');
  }

  function updateRadioSelection() {
    const cards = document.querySelectorAll('.cv-method-card');
    cards.forEach(card => {
      const radio = card.querySelector('input[type="radio"]');
      if (radio && radio.checked) {
        card.classList.add('border-border-strong', 'bg-surface-bright');
        card.classList.remove('border-border', 'bg-surface');
      } else {
        card.classList.remove('border-border-strong', 'bg-surface-bright');
        card.classList.add('border-border', 'bg-surface');
      }
    });
  }

  // Initialize selected visual state
  updateRadioSelection();
