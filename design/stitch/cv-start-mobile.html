</button>

<script>
  (function() {
    // Custom sync for submission method radio cards visual state indicator
    const radios = document.querySelectorAll('input[name="cv_submission_type"]');
    radios.forEach(radio => {
      radio.addEventListener('change', () => {
        radios.forEach(r => {
          const indicator = r.parentElement.querySelector('.w-2\\.5');
          const borderIndicator = r.parentElement.querySelector('.w-5');
          if (r.checked) {
            indicator && indicator.classList.remove('opacity-0');
            borderIndicator && borderIndicator.classList.add('border-accent-mark');
          } else {
            indicator && indicator.classList.add('opacity-0');
            borderIndicator && borderIndicator.classList.remove('border-accent-mark');
          }
        });
      });
    });
  })();
