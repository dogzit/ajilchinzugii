<html lang="mn"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,600;1,7..72,600&amp;family=Source+Sans+3:wght@400;500;600&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

    body {

  </head><body class="bg-background text-on-surface antialiased pt-safe pb-safe flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full bg-background"><div class="flex flex-col w-full relative min-w-[320px] max-w-[420px] mx-auto px-margin pb-space-2xl">
<!-- Subtle decorative ambient hexagon line pattern (No gradients, strictly warm outlines) -->
<div class="absolute inset-0 pointer-events-none overflow-hidden select-none opacity-40">
<svg class="w-full h-full text-border" height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="97" id="hex-grid" patterntransform="scale(0.8)" patternunits="userSpaceOnUse" width="56">
<path d="M28 0 L56 16.16 L56 48.49 L28 64.65 L0 48.49 L0 16.16 Z M28 48.49 L56 64.65 L56 96.98 L28 113.14 L0 96.98 L0 64.65 Z" fill="none" stroke="currentColor" stroke-dasharray="2,3" stroke-width="1"></path>
</pattern>
</defs>
<rect fill="url(#hex-grid)" height="100%" width="100%"></rect>
</svg>
</div>
<!-- Mobile Top Header Bar -->
<header class="relative z-10 flex items-center justify-between py-space-md w-full">
<!-- Left: Brand mark & Wordmark -->
<a class="flex items-center gap-space-sm group" href="#">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-primary">
<svg aria-hidden="true" class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<!-- Geometric stylized honeybee with hexagon motif -->
<path d="M12 2L19 6V14L12 18L5 14V6L12 2Z" fill="none" stroke="currentColor" stroke-width="1.5"></path>
<path d="M12 6L16 8.5V13.5L12 16L8 13.5V8.5L12 6Z" fill="#e8a33d"></path>
<path d="M10 10H14M9.5 12H14.5" stroke="#2b2118" stroke-linecap="round" stroke-width="1.2"></path>
</svg>
</div>
<span class="font-headline-sm text-headline-sm text-ink tracking-tight">Ажилчин Зөгий</span>
</a>
<!-- Right: Utility Controls (Language, Theme, Sign-in link, Menu) -->
<div class="flex items-center gap-1.5 sm:gap-2">
<button aria-label="Хэл солих" class="h-8 px-2.5 rounded-full bg-surface-container text-ink font-label-sm text-label-sm active:bg-secondary-container transition-colors" type="button">
        EN
      </button>
<button aria-label="Сэдэв солих" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-ink-muted active:text-ink transition-colors" type="button">
<span class="material-symbols-outlined text-[19px]">light_mode</span>
</button>
<button class="px-2 py-1 text-ink font-label-md text-label-md hover:text-primary transition-colors" type="button">
        Нэвтрэх
      </button>
<button aria-label="Цэс нээх" class="w-8 h-8 rounded-full flex items-center justify-center text-ink active:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[22px]">menu</span>
</button>
</div>
</header>
<!-- Center Card Slot -->
<div class="relative z-10 mt-space-lg flex flex-col items-center w-full">
<div class="w-full bg-surface rounded-lg p-space-lg flex flex-col items-center" style="border: 1px solid #eadfcc;">
<!-- Hexagon Bee Icon Badge -->
<div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center mb-space-md text-accent-mark" style="border: 1px solid #eadfcc;">
<svg aria-hidden="true" class="w-7 h-7" viewbox="0 0 24 24">
<path d="M12 2.5L19.5 6.8V15.5L12 19.8L4.5 15.5V6.8L12 2.5Z" fill="#ffddb5" stroke="#835400" stroke-width="1.2"></path>
<ellipse cx="12" cy="11.5" fill="#2b2118" rx="3.5" ry="4.5"></ellipse>
<path d="M10 10H14M9.5 12H14.5M10.2 13.8H13.8" stroke="#ffddb5" stroke-linecap="round" stroke-width="0.9"></path>
<path d="M8.5 8.5C6.5 7.5 5.5 9 7 11" fill="none" stroke="#835400" stroke-linecap="round" stroke-width="1.2"></path>
<path d="M15.5 8.5C17.5 7.5 18.5 9 17 11" fill="none" stroke="#835400" stroke-linecap="round" stroke-width="1.2"></path>
</svg>
</div>
<!-- Heading -->
<h1 class="font-headline-md text-headline-md text-ink text-center tracking-tight mb-space-xs">
        Нэвтрэх
      </h1>
<!-- Lead Explanation -->
<p class="font-body-sm text-body-sm text-ink-muted text-center max-w-[270px] leading-relaxed mb-space-xl">
        Бүртгэл заавал биш. Үнэлгээг нэвтрэхгүйгээр ашиглаж болно.
      </p>
<!-- Sign In Form -->
<form class="w-full flex flex-col" onsubmit="event.preventDefault();">
<div class="flex flex-col w-full mb-space-lg text-left">
<label class="font-label-md text-label-md text-ink mb-2" for="email-field">
            И-мэйл хаяг
          </label>
<div class="relative w-full">
<input autocomplete="email" class="w-full h-[50px] px-space-md rounded-full bg-surface text-ink font-body-md text-body-md placeholder:text-outline placeholder:opacity-70 outline-none transition-all focus:ring-2 focus:ring-primary-container" id="email-field" inputmode="email" name="email" placeholder="жишээ нь: bat@example.com" required="" style="border: 1px solid #eadfcc;" type="email"/>
</div>
</div>
<!-- Primary CTA: 52px full-width pill -->
<button class="w-full h-[52px] rounded-full bg-primary-container text-ink font-headline-sm text-[16px] tracking-wide flex items-center justify-center transition-all active:scale-[0.98] select-none shadow-none" type="submit">
          Үргэлжлүүлэх
        </button>
</form>
<!-- Registration Context Line -->
<div class="mt-space-lg pt-space-xs flex items-center justify-center gap-1 font-body-sm text-body-sm text-ink-muted">
<span>Бүртгэлгүй юу?</span>
<a class="font-label-md text-accent-text underline underline-offset-4 decoration-accent-text hover:text-ink transition-colors" href="#">
          Бүртгүүлэх
        </a>
</div>
</div>
<!-- Bottom Secondary Support Link -->
<footer class="mt-space-lg text-center">
<a class="font-body-sm text-body-sm text-ink-muted hover:underline hover:text-ink transition-colors" href="#">
        Нууцлалын бодлого
      </a>
</footer>
</div>
</div></main></body></html>
